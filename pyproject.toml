[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cirugias-tabu-dmab"
version = "0.1.0"
description = "Tabu Search y selección adaptativa de movimientos para instancias sintéticas de cirugía"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "matplotlib>=3.7", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
